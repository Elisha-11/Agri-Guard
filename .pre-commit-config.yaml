repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(backend|ml)/

  # One hook per folder, each with its own config: run from the repo root, black would otherwise
  # fall back to its 88-column default instead of the projects' 110 (and fight CI's black --check).
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: black (backend)
        files: ^backend/
        args: ["--config", "backend/pyproject.toml"]
      - id: black
        name: black (ml)
        files: ^ml/
        args: ["--config", "ml/pyproject.toml"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^pwa/(src|tests)/
