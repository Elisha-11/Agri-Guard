# Local services for development. Start with:  docker compose up -d db redis
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agriguard
      POSTGRES_USER: agriguard
      POSTGRES_PASSWORD: agriguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriguard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
